<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">SpecPi human-directed improvement loop</title>
  <desc id="loop-desc">Local friction becomes qualified evidence. A person chooses one exact improvement, SpecPi builds the smallest change, and proof retires it. Failed proof remains selected, while later evidence returns retired work to human review.</desc>
  <defs>
    <marker id="arrow-tea" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#c4a06a"/>
    </marker>
    <marker id="arrow-rice" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#95897a"/>
    </marker>
    <marker id="arrow-matcha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#aab784"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="876" height="356" rx="18" fill="#171310" stroke="#4a4438" stroke-width="2"/>
  <circle cx="42" cy="38" r="18" fill="#c4a06a"/>
  <text x="42" y="45" fill="#171310" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" text-anchor="middle">π</text>
  <text x="72" y="32" fill="#e3c28f" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2">THE IMPROVEMENT LOOP</text>
  <text x="72" y="52" fill="#95897a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Evidence proposes. A person chooses. Proof closes.</text>
  <path d="M42 72H838" stroke="#342c25"/>

  <g fill="none" stroke="#6b5842" stroke-width="2" marker-end="url(#arrow-tea)">
    <path d="M112 146H196"/>
    <path d="M254 146H338"/>
    <path d="M396 146H480"/>
    <path d="M538 146H622"/>
    <path d="M680 146H764"/>
  </g>

  <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">
    <text x="84" y="100" fill="#95897a">01 · SIGNAL</text>
    <text x="226" y="100" fill="#95897a">02 · EVIDENCE</text>
    <text x="368" y="100" fill="#e3c28f">03 · DECISION</text>
    <text x="510" y="100" fill="#95897a">04 · CHANGE</text>
    <text x="652" y="100" fill="#aab784">05 · VERIFY</text>
    <text x="794" y="100" fill="#aab784">06 · OUTCOME</text>
  </g>

  <g text-anchor="middle">
    <g>
      <circle cx="84" cy="146" r="28" fill="#201a15" stroke="#5c4c3c" stroke-width="2"/>
      <circle cx="84" cy="146" r="5" fill="#c4a06a"/>
      <text x="84" y="198" fill="#f1eade" font-family="Georgia, 'Times New Roman', serif" font-size="18">Friction</text>
      <text x="84" y="218" fill="#95897a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">local only</text>
    </g>
    <g>
      <circle cx="226" cy="146" r="28" fill="#201a15" stroke="#5c4c3c" stroke-width="2"/>
      <path d="M215 151h22M215 144h16M215 137h19" stroke="#c4a06a" stroke-width="2" stroke-linecap="round"/>
      <text x="226" y="198" fill="#f1eade" font-family="Georgia, 'Times New Roman', serif" font-size="18">Qualify</text>
      <text x="226" y="218" fill="#95897a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">repeat + reach</text>
    </g>
    <g>
      <circle cx="368" cy="146" r="33" fill="#c4a06a"/>
      <path d="M354 146l9 9 19-21" fill="none" stroke="#171310" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="368" y="198" fill="#e3c28f" font-family="Georgia, 'Times New Roman', serif" font-size="18">Choose</text>
      <text x="368" y="218" fill="#b9aa99" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">human gate</text>
    </g>
    <g>
      <circle cx="510" cy="146" r="28" fill="#201a15" stroke="#5c4c3c" stroke-width="2"/>
      <path d="M500 153l18-18M499 138l15 15" fill="none" stroke="#c4a06a" stroke-width="2.5" stroke-linecap="round"/>
      <text x="510" y="198" fill="#f1eade" font-family="Georgia, 'Times New Roman', serif" font-size="18">Build</text>
      <text x="510" y="218" fill="#95897a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">smallest scope</text>
    </g>
    <g>
      <circle cx="652" cy="146" r="28" fill="#1d2119" stroke="#aab784" stroke-width="2"/>
      <path d="M641 146l7 7 15-17" fill="none" stroke="#aab784" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="652" y="198" fill="#f1eade" font-family="Georgia, 'Times New Roman', serif" font-size="18">Prove</text>
      <text x="652" y="218" fill="#95897a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">tests + gate</text>
    </g>
    <g>
      <circle cx="794" cy="146" r="28" fill="#aab784"/>
      <path d="M783 140h22v16h-22zM788 135h12" fill="none" stroke="#171310" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="794" y="198" fill="#dce3c8" font-family="Georgia, 'Times New Roman', serif" font-size="18">Retire</text>
      <text x="794" y="218" fill="#a9a18f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">only on pass</text>
    </g>
  </g>

  <path id="verification-failure-return" d="M652 234v25H510v-25" fill="none" stroke="#95897a" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow-rice)"/>
  <rect x="481" y="247" width="200" height="22" rx="11" fill="#171310"/>
  <text x="581" y="263" fill="#b9aa99" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="14" text-anchor="middle">FAIL · STAYS SELECTED</text>

  <path id="later-evidence-review-return" d="M794 234v73H368v-73" fill="none" stroke="#aab784" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow-matcha)"/>
  <rect x="445" y="295" width="272" height="22" rx="11" fill="#171310"/>
  <text x="581" y="311" fill="#aab784" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="14" text-anchor="middle">LATER EVIDENCE · HUMAN REVIEW</text>

  <text x="42" y="341" fill="#95897a" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="14" letter-spacing="1">PRIVATE SIGNAL → EXPLICIT AUTHORITY → VERIFIED CHANGE</text>
</svg>
