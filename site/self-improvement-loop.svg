<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">ZenPi human-gated self-improvement loop</title>
  <desc id="loop-desc">Local friction becomes privacy-minimized evidence. A human chooses an improvement, ZenPi builds the smallest change, and verification either retires passing work or returns a failure to selected work. Later evidence returns retired work to human review without reopening it automatically.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#d8b56d"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9bc5a5"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#dc8e72"/></marker>
  </defs>
  <rect x="6" y="6" width="628" height="888" rx="28" fill="#171b18" stroke="#6f8f68" stroke-width="3"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="320" y="52" fill="#f5edda" font-size="30" font-weight="700">Let friction teach the system</text>
    <g fill="#263029" stroke="#6f8f68" stroke-width="3">
      <rect x="100" y="82" width="440" height="92" rx="20"/>
      <rect x="100" y="214" width="440" height="92" rx="20"/>
      <rect x="100" y="498" width="440" height="92" rx="20"/>
      <rect x="100" y="762" width="440" height="92" rx="20"/>
    </g>
    <text x="320" y="120" fill="#f5edda" font-size="27" font-weight="700">Observe local friction</text>
    <text x="320" y="151" fill="#c6cbbb" font-size="24">real · private</text>
    <text x="320" y="252" fill="#f5edda" font-size="27" font-weight="700">Repeat and qualify</text>
    <text x="320" y="283" fill="#c6cbbb" font-size="24">privacy-minimized evidence</text>
    <polygon points="320,346 540,416 320,486 100,416" fill="#614936" stroke="#e4c681" stroke-width="4"/>
    <text x="320" y="396" fill="#fff7e5" font-size="27" font-weight="700">Human review</text>
    <text x="320" y="428" fill="#fff7e5" font-size="24">choose /harness-improvement</text>
    <text x="320" y="458" fill="#f2d9aa" font-size="22">review, not reopen</text>
    <text x="320" y="536" fill="#f5edda" font-size="27" font-weight="700">Build smallest change</text>
    <text x="320" y="567" fill="#c6cbbb" font-size="24">only the selected work</text>
    <polygon points="320,626 540,686 320,746 100,686" fill="#35564c" stroke="#9bc5a5" stroke-width="4"/>
    <text x="320" y="678" fill="#fff" font-size="28" font-weight="700">Verify</text>
    <text x="320" y="711" fill="#dfeee1" font-size="24">proof gate</text>
    <text x="320" y="800" fill="#f5edda" font-size="27" font-weight="700">Retire passing work</text>
    <text x="320" y="831" fill="#c6cbbb" font-size="24">capability shipped</text>
  </g>
  <g fill="none" stroke="#d8b56d" stroke-width="5" marker-end="url(#arrow)">
    <path d="M320 174V205"/><path d="M320 306V337"/><path d="M320 486V489"/><path d="M320 590V617"/><path d="M320 746V753"/>
  </g>
  <path id="verification-failure-return" d="M100 686H30V544H91" fill="none" stroke="#dc8e72" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrow-red)"/>
  <g font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#f0b39d" text-anchor="middle">
    <text x="65" y="690" transform="rotate(-90 65 690)">failure · remains selected</text>
  </g>
  <path id="later-evidence-review-return" d="M540 808H610V416H549" fill="none" stroke="#9bc5a5" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrow-green)"/>
  <g font-family="system-ui,sans-serif" font-size="22" fill="#b9d8bd" text-anchor="middle">
    <text x="575" y="650" transform="rotate(-90 575 650)">later evidence · review</text>
  </g>
</svg>
