name: delegation

on:
  push:
    paths: ["packages/delegation/**", ".github/workflows/delegation*.yml"]
  pull_request:
    paths: ["packages/delegation/**", ".github/workflows/delegation*.yml"]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/delegation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: npm ci --ignore-scripts --omit=peer
      - run: npm run check
      - run: git diff --check
