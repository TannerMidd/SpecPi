name: publish-npm

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  RELEASE_NPM_VERSION: "11.19.1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install pinned release npm
        run: npm install --global --ignore-scripts npm@${RELEASE_NPM_VERSION} --no-audit --no-fund

      - name: Install pinned repository development tools
        run: npm install --ignore-scripts --omit=peer --no-package-lock

      - name: Run repository and packed-artifact checks
        run: npm run check

      - name: Load the packed resources through pinned Pi
        run: npm run check:pi-package

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node --print "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          grep --extended-regexp --line-regexp "## ${VERSION} - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md
          if npm view "specpi@${VERSION}" version >/dev/null 2>&1; then
            echo "specpi@${VERSION} already exists and cannot be replaced" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Build the release artifact once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --ignore-scripts --json --pack-destination dist > dist/npm-pack.json
          TARBALL="dist/specpi-${VERSION}.tgz"
          test -f "${TARBALL}"
          sha512sum "${TARBALL}" > "${TARBALL}.sha512"
          npm publish --dry-run --ignore-scripts "${TARBALL}"

      - name: Upload validated npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: specpi-npm-${{ env.VERSION }}
          path: |
            dist/specpi-${{ env.VERSION }}.tgz
            dist/specpi-${{ env.VERSION }}.tgz.sha512
            dist/npm-pack.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install pinned release npm
        run: npm install --global --ignore-scripts npm@${RELEASE_NPM_VERSION} --no-audit --no-fund

      - name: Read release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node --print "require('./package.json').version")"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Download validated npm artifact
        uses: actions/download-artifact@v4
        with:
          name: specpi-npm-${{ env.VERSION }}
          path: dist

      - name: Verify downloaded artifact
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha512sum --check "specpi-${VERSION}.tgz.sha512"

      - name: Publish with npm provenance
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="dist/specpi-${VERSION}.tgz"
          if [[ "${VERSION}" == *-* ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          npm publish --ignore-scripts --access public --provenance --tag "${DIST_TAG}" "${TARBALL}"
          echo "DIST_TAG=${DIST_TAG}" >> "${GITHUB_ENV}"

      - name: Verify registry publication
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "dist/specpi-${VERSION}.tgz" | openssl base64 -A)"
          for attempt in 1 2 3 4 5 6; do
            ACTUAL_VERSION="$(npm view "specpi@${VERSION}" version 2>/dev/null || true)"
            ACTUAL_INTEGRITY="$(npm view "specpi@${VERSION}" dist.integrity 2>/dev/null || true)"
            ACTUAL_TAG="$(npm view "specpi" "dist-tags.${DIST_TAG}" 2>/dev/null || true)"
            ATTESTATION_URL="$(npm view "specpi@${VERSION}" dist.attestations.url 2>/dev/null || true)"
            if [[ "${ACTUAL_VERSION}" == "${VERSION}" && "${ACTUAL_INTEGRITY}" == "${EXPECTED_INTEGRITY}" && "${ACTUAL_TAG}" == "${VERSION}" && -n "${ATTESTATION_URL}" ]]; then
              printf 'Verified specpi@%s (%s) with provenance\n' "${VERSION}" "${DIST_TAG}"
              exit 0
            fi
            sleep 10
          done
          echo "Published package did not converge to the expected version, integrity, dist-tag, and provenance" >&2
          exit 1
