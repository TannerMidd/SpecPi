name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned development tools
        run: npm install --ignore-scripts --omit=peer --no-package-lock
      - run: npm run check
      - run: npm run check:pi-package
      - run: npm run check:base
      - name: Install browser for Chat rendering checks
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run check:site
      - run: npm --prefix vscode run test:render
      - run: git diff --check

  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Install pinned development tools
        run: npm install --ignore-scripts --omit=peer --no-package-lock
      - name: Exercise scope, loop, migration and rollback
        run: npm test
      - run: npm run check:package
      - run: npm run check:pi-package
      - run: npm run check:base
      - run: npm run check:vscode
      - run: git diff --check
