name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run check

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exercise Windows launcher and command shims
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:NODE_OPTIONS = "--throw-deprecation"
          .\zenpi.cmd plan --skip-package-install --skip-shell

          $root = Join-Path $env:RUNNER_TEMP "zenpi-windows-smoke"
          $agentDir = Join-Path $root "agent"
          $fakeBin = Join-Path $root "bin"
          $log = Join-Path $root "pi.log"
          New-Item -ItemType Directory -Force $agentDir, $fakeBin | Out-Null
          @'
          @echo off
          if "%~1"=="--version" (
            echo 0.84.3
            exit /b 0
          )
          echo %*>>"%ZENPI_FAKE_LOG%"
          exit /b 0
          '@ | Set-Content (Join-Path $fakeBin "pi-template.cmd") -Encoding ascii
          "#!/bin/sh`nexit 99" | Set-Content (Join-Path $fakeBin "pi") -Encoding ascii
          @'
          @echo off
          if "%~1"=="install" if "%~2"=="--global" if "%~3"=="--ignore-scripts" (
            echo npm %*>>"%ZENPI_FAKE_LOG%"
            copy /y "%ZENPI_FAKE_BIN%\pi-template.cmd" "%ZENPI_FAKE_BIN%\pi.cmd" >nul
            exit /b 0
          )
          if "%~1"=="install" if "%~2"=="--global" (
            echo npm %*>>"%ZENPI_FAKE_LOG%"
            echo @exit /b 0>"%ZENPI_FAKE_BIN%\donsetch.cmd"
            exit /b 0
          )
          node "%ZENPI_REPO%\tests\fixtures\fake-browser-npm.mjs" %*
          exit /b %ERRORLEVEL%
          '@ | Set-Content (Join-Path $fakeBin "npm.cmd") -Encoding ascii
          "#!/bin/sh`nexit 99" | Set-Content (Join-Path $fakeBin "npm") -Encoding ascii
          $nodeDir = Split-Path (Get-Command node).Source
          $env:PATH = "$fakeBin;$nodeDir;$env:SystemRoot\System32;$env:SystemRoot"
          $env:PI_CODING_AGENT_DIR = $agentDir
          $env:ZENPI_FAKE_BIN = $fakeBin
          $env:ZENPI_FAKE_LOG = $log
          $env:ZENPI_REPO = (Get-Location).Path
          .\zenpi.cmd install --yes --skip-shell
          .\zenpi.cmd doctor

          $installCalls = @(Get-Content $log | Where-Object { $_ -match '^"?install"? ' })
          if ($installCalls.Count -ne 6) {
            throw "Expected 6 pi install calls, found $($installCalls.Count)"
          }
          $piBootstrapCalls = @(Get-Content $log | Where-Object {
            $_ -match '^npm "?install"? "?--global"? "?--ignore-scripts"? "?@earendil-works/pi-coding-agent@0\.84\.3"? '
          })
          if ($piBootstrapCalls.Count -ne 1) {
            throw "Expected 1 Pi bootstrap call, found $($piBootstrapCalls.Count)"
          }
          $toolCalls = @(Get-Content $log | Where-Object {
            $_ -match '^npm "?install"? "?--global"? "?donsetch@3\.4\.0"? '
          })
          if ($toolCalls.Count -ne 1) {
            throw "Expected 1 optional tool install call, found $($toolCalls.Count)"
          }

          .\zenpi.cmd uninstall --yes
