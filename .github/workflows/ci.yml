name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned repository development tools
        run: npm install --ignore-scripts --omit=peer --no-package-lock
      - run: npm test
      - run: npm run check
      - name: Load the packed resources through pinned Pi
        run: npm run check:pi-package
      - run: git diff --check

  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Install pinned repository development tools
        run: npm install --ignore-scripts --omit=peer --no-package-lock
      - name: Exercise packed npm artifact and installer lifecycle
        run: npm run check:package

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exercise PowerShell 5.1, PowerShell 7, cmd, and policy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:SPECPI_TEST_GIT_BASH = Join-Path $env:ProgramFiles "Git\bin\bash.exe"
          if (-not (Test-Path $env:SPECPI_TEST_GIT_BASH)) { throw "Git Bash is required for the Windows command-guard matrix" }
          $env:SPECPI_TEST_POWERSHELL_EXE = (Get-Command powershell.exe).Source
          node tests/fixtures/command-guard-windows-runtime.mjs
          $env:SPECPI_TEST_POWERSHELL_EXE = (Get-Command pwsh.exe).Source
          node tests/fixtures/command-guard-windows-runtime.mjs
          node --test tests/command-guard.test.mjs tests/command-guard-paths.test.mjs tests/command-guard-extension.test.mjs
      - name: Exercise Windows launcher and lifecycle shims
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:NODE_OPTIONS = "--throw-deprecation"

          $root = Join-Path $env:RUNNER_TEMP "specpi-windows-smoke"
          $agentDir = Join-Path $root "agent"
          $fakeBin = Join-Path $root "bin"
          $log = Join-Path $root "pi.log"
          New-Item -ItemType Directory -Force $agentDir, $fakeBin | Out-Null
          @'
          @echo off
          if "%~1"=="--version" (
            echo 0.84.4
            exit /b 0
          )
          echo %*>>"%SPECPI_FAKE_LOG%"
          exit /b 0
          '@ | Set-Content (Join-Path $fakeBin "pi-template.cmd") -Encoding ascii
          "#!/bin/sh`nexit 99" | Set-Content (Join-Path $fakeBin "pi") -Encoding ascii
          @'
          @echo off
          if "%~1"=="install" if "%~2"=="--global" if "%~3"=="--ignore-scripts" (
            echo npm %*>>"%SPECPI_FAKE_LOG%"
            copy /y "%SPECPI_FAKE_BIN%\pi-template.cmd" "%SPECPI_FAKE_BIN%\pi.cmd" >nul
            exit /b 0
          )
          if "%~1"=="install" if "%~2"=="--global" (
            echo npm %*>>"%SPECPI_FAKE_LOG%"
            echo @exit /b 0>"%SPECPI_FAKE_BIN%\donsetch.cmd"
            exit /b 0
          )
          node "%SPECPI_REPO%\tests\fixtures\fake-browser-npm.mjs" %*
          exit /b %ERRORLEVEL%
          '@ | Set-Content (Join-Path $fakeBin "npm.cmd") -Encoding ascii
          "#!/bin/sh`nexit 99" | Set-Content (Join-Path $fakeBin "npm") -Encoding ascii
          $nodeDir = Split-Path (Get-Command node).Source
          $gitDir = Split-Path (Get-Command git).Source
          $env:PATH = "$fakeBin;$nodeDir;$gitDir;$env:SystemRoot\System32;$env:SystemRoot"
          $env:PI_CODING_AGENT_DIR = $agentDir
          $env:SPECPI_FAKE_BIN = $fakeBin
          $env:SPECPI_FAKE_LOG = $log
          $env:SPECPI_REPO = (Get-Location).Path
          .\specpi.cmd plan --skip-package-install --skip-shell
          .\specpi.cmd install --yes --skip-shell
          .\specpi.cmd doctor

          $settingsBefore = [IO.File]::ReadAllBytes((Join-Path $agentDir "settings.json"))
          $manifestBefore = [IO.File]::ReadAllBytes((Join-Path $agentDir "specpi\manifest.json"))
          $guardBefore = @{}
          Get-ChildItem (Join-Path $agentDir "extensions\command-guard") -File | ForEach-Object { $guardBefore[$_.Name] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
          $env:SPECPI_TESTING = "1"
          $env:SPECPI_TEST_FAIL_POINT = "after-first-command-guard-file"
          $PSNativeCommandUseErrorActionPreference = $false
          .\specpi.cmd update --yes --force --skip-package-install --skip-browser-install --skip-tool-install --skip-shell
          if ($LASTEXITCODE -eq 0) { throw "Injected Windows update failure unexpectedly succeeded" }
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item Env:SPECPI_TEST_FAIL_POINT, Env:SPECPI_TESTING
          if ([Convert]::ToBase64String($settingsBefore) -ne [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $agentDir "settings.json")))) { throw "Settings were not rolled back byte-for-byte" }
          if ([Convert]::ToBase64String($manifestBefore) -ne [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $agentDir "specpi\manifest.json")))) { throw "Manifest was not rolled back byte-for-byte" }
          Get-ChildItem (Join-Path $agentDir "extensions\command-guard") -File | ForEach-Object { if ($guardBefore[$_.Name] -ne (Get-FileHash $_.FullName -Algorithm SHA256).Hash) { throw "Guard file was not rolled back: $($_.Name)" } }
          .\specpi.cmd update --yes --skip-package-install --skip-browser-install --skip-tool-install --skip-shell
          .\specpi.cmd doctor

          $installCalls = @(Get-Content $log | Where-Object { $_ -match '^"?install"? ' })
          if ($installCalls.Count -ne 5) {
            throw "Expected 5 pi install calls, found $($installCalls.Count)"
          }
          $piBootstrapCalls = @(Get-Content $log | Where-Object {
            $_ -match '^npm "?install"? "?--global"? "?--ignore-scripts"? "?@earendil-works/pi-coding-agent@0\.84\.4"? '
          })
          if ($piBootstrapCalls.Count -ne 1) {
            throw "Expected 1 Pi bootstrap call, found $($piBootstrapCalls.Count)"
          }
          $toolCalls = @(Get-Content $log | Where-Object {
            $_ -match '^npm "?install"? "?--global"? "?donsetch@3\.4\.0"? '
          })
          if ($toolCalls.Count -ne 1) {
            throw "Expected 1 optional tool install call, found $($toolCalls.Count)"
          }

          .\specpi.cmd uninstall --yes
      - shell: pwsh
        run: git diff --check
